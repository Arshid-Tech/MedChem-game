services:
  - type: web
    name: pharmacochem-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,.arshid.tech,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.arshid.tech"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://pharmacochem.arshid.tech,https://pharmacochem-frontend.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacochem-db
          property: connectionString

  - type: web
    name: pharmacochem-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pharmacochem-backend
          property: host

databases:
  - name: pharmacochem-db
    plan: free
    databaseName: pharmacochem
    user: pharmacochem_user
